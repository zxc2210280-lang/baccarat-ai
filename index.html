<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081426">
<title>AI PRO V23 STABLE</title>
<style>
:root{--bg:#071322;--panel:#0e1d31;--line:#2a4161;--text:#f4f7fb;--muted:#9eb0c8;--red:#f04455;--blue:#347cf0;--green:#20be63;--warn:#ffd166}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.hero{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.hero h1{margin:0;font-size:28px}.muted{color:var(--muted)}.badge{border:1px solid var(--line);background:#10243c;border-radius:999px;padding:9px 12px;text-align:center}.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}button,.fileBtn{min-height:54px;border:1px solid var(--line);border-radius:15px;background:#14243a;color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;padding:10px}.b{background:var(--red)}.p{background:var(--blue)}.t{background:var(--green)}.fileBtn input{display:none}.danger{color:#ff7d88}.preview{width:100%;max-height:560px;object-fit:contain;border-radius:14px;background:#06101c;margin:10px 0}.row{display:flex;gap:10px;margin-top:10px}.row>*{flex:1}textarea{width:100%;min-height:88px;border:1px solid var(--line);border-radius:14px;background:#071525;color:#fff;padding:12px;font-size:16px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.notice{padding:12px;border-radius:12px;background:#0a1728;border:1px solid var(--line);margin-top:10px}.ok{color:var(--green)}.warn{color:var(--warn)}.bad{color:var(--red)}.road{display:grid;grid-auto-flow:column;grid-template-rows:repeat(6,34px);grid-auto-columns:34px;min-height:210px;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:8px;background:#071525;justify-content:start}.dot{width:28px;height:28px;border-radius:50%;margin:3px;border:3px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}.dot.fill{color:#fff}.dot.B{color:var(--red)}.dot.P{color:var(--blue)}.dot.T{color:var(--green)}.dot.fill.B{background:var(--red)}.dot.fill.P{background:var(--blue)}.dot.fill.T{background:var(--green)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stats b{display:block;font-size:26px}.call{margin:12px auto 0;max-width:260px;text-align:center;padding:14px;border-radius:14px;background:#53627a;font-size:24px;font-weight:900}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#101a28;padding:11px 16px;border-radius:12px;opacity:0;transition:.2s;z-index:99}.toast.show{opacity:1}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body><main class="wrap">
<header class="hero"><div><h1>AI PRO V23 STABLE</h1><p class="muted">inja777・手動輸入優先・截圖辨識先確認再匯入</p></div><div><div class="badge">已啟動</div><div class="badge" style="margin-top:6px">BUILD V23</div></div></header>
<section class="panel"><h2>本鞋輸入</h2><div class="grid">
<button class="b" data-r="B">B 莊</button><button class="p" data-r="P">P 閒</button><button class="t" data-r="T">T 和</button><button id="undo">復原</button>
<label class="fileBtn">選擇截圖<input id="file" type="file" accept="image/*"></label><button id="recognize">重新辨識</button><button id="newShoe">封存／新鞋</button><button id="clear" class="danger">清除本鞋</button>
</div>
<p class="muted">截圖辨識不會直接覆蓋本鞋。先核對下方 B/P/T，再按「確認序列並匯入」。六列定位失敗也不會把程式鎖死。</p>
<img id="preview" class="preview" alt=""><canvas id="cv" class="preview" hidden></canvas>
<textarea id="seq" placeholder="辨識後會出現在這裡；可直接手動修正 B/P/T"></textarea>
<div class="row"><button id="confirm">確認序列並匯入</button><button id="append">接續目前鞋</button></div>
<div id="ocrStatus" class="notice">尚未載入圖片。</div>
</section>
<section class="panel"><h2>目前分析</h2><div class="stats"><div><b id="bPct">50.0%</b><span class="muted">莊傾向</span></div><div><b id="conf">0%</b><span class="muted">信心</span></div><div><b id="pPct">50.0%</b><span class="muted">閒傾向</span></div></div><div id="call" class="call">PASS</div><p class="muted">僅為路單統計分析，不代表下一局可被確定預測。</p></section>
<section class="panel"><h2>路單</h2><h3>珠盤路</h3><div id="bead" class="road"></div><h3>大路</h3><div id="big" class="road"></div><h3>大眼仔路</h3><div id="eye" class="road"></div><h3>小路</h3><div id="small" class="road"></div><h3>曱甴路</h3><div id="cock" class="road"></div></section>
</main><div id="toast" class="toast"></div>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)},KEY='AI_PRO_V23_STATE';
var state={current:[]};try{var saved=JSON.parse(localStorage.getItem(KEY)||'{}');if(Array.isArray(saved.current))state.current=saved.current;}catch(e){}
function clean(s){return(s||[]).filter(function(x){return x==='B'||x==='P'||x==='T';});}
function save(){localStorage.setItem(KEY,JSON.stringify(state));render();}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(function(){$('toast').classList.remove('show');},1800)}
var Roads=(function(){
function bead(seq){return seq.map(function(x,i){return{result:x,row:i%6,col:Math.floor(i/6),fill:true,ties:0};});}
function big(seq){var out=[],occ={},current=null,runStartCol=0,pendingTies=0;seq.forEach(function(x){if(x==='T'){if(current)current.ties=(current.ties||0)+1;else pendingTies++;return;}if(!current){current={result:x,row:0,col:0,ties:pendingTies};pendingTies=0;runStartCol=0;out.push(current);occ['0,0']=current;return;}var row,col;if(x===current.result){if(current.row<5&&!occ[(current.row+1)+','+current.col]){row=current.row+1;col=current.col;}else{row=current.row;col=current.col+1;while(occ[row+','+col])col++;}}else{row=0;col=runStartCol+1;while(occ[row+','+col])col++;runStartCol=col;}current={result:x,row:row,col:col,ties:0};out.push(current);occ[row+','+col]=current;});return out;}
function heights(c){var h={};c.forEach(function(x){h[x.col]=Math.max(h[x.col]||0,x.row+1)});return h}function occ(c){var o={};c.forEach(function(x){o[x.row+','+x.col]=1});return o}
function sig(c,off){var s=[],h=heights(c),o=occ(c);c.forEach(function(x){var enough=x.row===0?x.col>=off+1:x.col>=off;if(!enough)return;var red;if(x.row===0){red=(h[x.col-1]||0)===(h[x.col-1-off]||0);}else{red=(!!o[x.row+','+(x.col-off)])===(!!o[(x.row-1)+','+(x.col-off)]);}s.push(red?'B':'P');});return s;}
function marker(s){var cells=[],o={},cur=null,run=0;s.forEach(function(x){if(!cur){cur={result:x,row:0,col:0,fill:true};cells.push(cur);o['0,0']=1;return;}var r,c;if(x===cur.result){if(cur.row<5&&!o[(cur.row+1)+','+cur.col]){r=cur.row+1;c=cur.col}else{r=cur.row;c=cur.col+1;while(o[r+','+c])c++;}}else{r=0;c=run+1;while(o[r+','+c])c++;run=c;}cur={result:x,row:r,col:c,fill:true};cells.push(cur);o[r+','+c]=1;});return cells;}
function data(seq){var b=big(seq);return{bead:bead(seq),big:b,eye:marker(sig(b,1)),small:marker(sig(b,2)),cock:marker(sig(b,3))};}
function draw(id,cells,fill){var el=$(id);el.innerHTML='';cells.forEach(function(c){var d=document.createElement('div');d.className='dot '+c.result+(fill||c.fill?' fill':'');if(id==='bead')d.textContent=c.result;else if(id==='big'&&c.ties)d.textContent='T'+c.ties;d.style.gridRow=c.row+1;d.style.gridColumn=c.col+1;el.appendChild(d);});}
function render(seq){var d=data(seq);draw('bead',d.bead,true);draw('big',d.big,false);draw('eye',d.eye,true);draw('small',d.small,true);draw('cock',d.cock,true);}return{render:render};})();
function analyze(seq){var a=seq.filter(function(x){return x!=='T'});if(a.length<6)return{b:50,p:50,c:0,call:'PASS'};var last=a[a.length-1],st=0;for(var i=a.length-1;i>=0&&a[i]===last;i--)st++;var recent=a.slice(-10),b=recent.filter(function(x){return x==='B'}).length,p=recent.length-b,score=(b-p)*2+(last==='B'?1:-1)*Math.min(5,st);var bp=Math.max(40,Math.min(60,50+score));var conf=Math.min(85,Math.round(Math.abs(bp-50)*6+a.length/3));var call=(conf>=55&&Math.abs(bp-50)>=6)?(bp>50?'B':'P'):'PASS';return{b:bp,p:100-bp,c:conf,call:call};}
function render(){Roads.render(state.current);var a=analyze(state.current);$('bPct').textContent=a.b.toFixed(1)+'%';$('pPct').textContent=a.p.toFixed(1)+'%';$('conf').textContent=a.c+'%';$('call').textContent=a.call==='B'?'B 莊':a.call==='P'?'P 閒':'PASS';$('call').style.background=a.call==='B'?'#f04455':a.call==='P'?'#347cf0':'#53627a';}
document.querySelectorAll('[data-r]').forEach(function(b){b.onclick=function(){state.current.push(this.dataset.r);save();}});$('undo').onclick=function(){state.current.pop();save()};$('clear').onclick=function(){if(confirm('確定清除本鞋？')){state.current=[];save()}};$('newShoe').onclick=function(){state.current=[];save();toast('已開始新鞋')};
var imgObj=null,lastCandidate=[];
function classify(r,g,b){var mx=Math.max(r,g,b),mn=Math.min(r,g,b);if(mx<60||mx-mn<25)return null;if(r>105&&r>g*1.08&&r>b*1.06)return'B';if(b>92&&b>r*1.03&&b>=g*.84)return'P';if(g>82&&g>r*1.03&&g>b*.88)return'T';return null;}
function recognize(){if(!imgObj)throw new Error('請先選擇截圖');var w=imgObj.naturalWidth,h=imgObj.naturalHeight,c=$('cv');c.width=w;c.height=h;var g=c.getContext('2d');g.drawImage(imgObj,0,0,w,h);var im=g.getImageData(0,0,w,h).data;function rgb(x,y){x=Math.max(0,Math.min(w-1,Math.round(x)));y=Math.max(0,Math.min(h-1,Math.round(y)));var k=(y*w+x)*4;return[im[k],im[k+1],im[k+2]]}function vote(cx,cy,dx,dy){var n={B:0,P:0,T:0},tot=0;[.5,.72,.92].forEach(function(rr){var rad=Math.min(dx,dy)*.36*rr;for(var k=0;k<20;k++){var a=Math.PI*2*k/20,v=rgb(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad),z=classify(v[0],v[1],v[2]);tot++;if(z)n[z]++;}});var r='B';if(n.P>n[r])r='P';if(n.T>n[r])r='T';return n[r]>=7?{r:r,c:n[r]/tot}:null;}
var profiles=[{x:.028,y:.676,dx:.046,dy:.0218},{x:.032,y:.684,dx:.046,dy:.0218},{x:.036,y:.692,dx:.0455,dy:.022},{x:.030,y:.700,dx:.0455,dy:.022}];var best=null;profiles.forEach(function(p){[-.04,0,.04].forEach(function(sf){for(var ox=-5;ox<=5;ox++)for(var oy=-7;oy<=7;oy++){var dx=p.dx*w*(1+sf),dy=p.dy*h*(1+sf),x0=p.x*w+ox*dx*.08,y0=p.y*h+oy*dy*.08,seq=[],conf=0,holes=0;for(var col=0;col<16;col++){var vals=[];for(var row=0;row<6;row++)vals.push(vote(x0+col*dx,y0+row*dy,dx,dy));var pref=0;while(pref<6&&vals[pref])pref++;if(pref===0){if(seq.length)break;continue;}for(var q=pref;q<6;q++)if(vals[q])holes++;for(var row=0;row<pref;row++){seq.push(vals[row].r);conf+=vals[row].c;}if(pref<6)break;}if(seq.length<6)return;var cnt={B:0,P:0,T:0};seq.forEach(function(v){cnt[v]++});var maj=Math.max(cnt.B,cnt.P,cnt.T)/seq.length,unique=(cnt.B?1:0)+(cnt.P?1:0)+(cnt.T?1:0),score=seq.length*180+(conf/seq.length)*2200-holes*700+(unique>=2?500:0)+(unique===3?250:0)-(maj>.96?2500:0);if(!best||score>best.score)best={seq:seq,score:score,c:conf/seq.length,holes:holes};}})});if(!best)throw new Error('沒有找到可靠珠盤；可直接手動修正序列後匯入');lastCandidate=best.seq.slice();$('seq').value=best.seq.join('');var cnt={B:0,P:0,T:0};best.seq.forEach(function(v){cnt[v]++});$('ocrStatus').innerHTML='<span class="'+(best.holes?'warn':'ok')+'">已抓到 '+best.seq.length+' 局｜莊 '+cnt.B+'｜閒 '+cnt.P+'｜和 '+cnt.T+'｜信心 '+Math.round(best.c*100)+'%</span><br><span class="muted">請先核對 B/P/T；即使定位不完整也可手動修正後匯入。</span>';return best;}
$('file').onchange=function(){var f=this.files&&this.files[0];if(!f)return;var u=URL.createObjectURL(f),im=new Image();im.onload=function(){imgObj=im;$('preview').src=u;$('preview').style.display='block';try{recognize();}catch(e){$('ocrStatus').innerHTML='<span class="warn">'+e.message+'</span><br><span class="muted">程式不會鎖死；可在上方直接輸入/修正 B/P/T 後按確認。</span>';}};im.src=u;this.value='';};$('recognize').onclick=function(){try{recognize()}catch(e){$('ocrStatus').innerHTML='<span class="warn">'+e.message+'</span>'}};
function seqBox(){return clean(($('seq').value.toUpperCase().match(/[BPT]/g)||[]));}$('confirm').onclick=function(){var s=seqBox();if(s.length<1)return toast('沒有序列');state.current=s;save();$('ocrStatus').innerHTML='<span class="ok">已匯入 '+s.length+' 局，五路已重建。</span>';toast('已確認並匯入')};$('append').onclick=function(){var s=seqBox();if(!s.length)return toast('沒有序列');state.current=state.current.concat(s);save();toast('已接續目前鞋')};
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')localStorage.setItem(KEY,JSON.stringify(state));});window.addEventListener('pagehide',function(){localStorage.setItem(KEY,JSON.stringify(state));});render();
})();
</script></body></html>
